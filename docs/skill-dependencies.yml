schema_version: 1
description: >
  Single source of truth for skill runtime dependencies. When a skill is added
  or dependency-relevant files change, review this file and refresh the
  dependency_review.source_fingerprint value.
skills:
  aurora-tun-bypass:
    path: skills/aurora-tun-bypass
    dependency_review:
      source_fingerprint: sha256:0ab0a12794156466f2f42414672b83b5eedcffd2c4c21dac99c6264137f718de
      reviewed_at: "2026-10-16"
      reviewed_by: agent
      note: Windows/Python/cryptography support the local CLI; frida, compatible running Aurora, loopback APIs and writable HKCU Run are needed for the persistent memory hook. The verifier checks platform, module discovery (only installed-local Frida fallback is actually imported), and default config existence/readability; it does not test Python minimum version, hook/API/HKCU access, decryption, or persistence. Initial package acquisition may require PyPI; no Aurora credentials are required.
    windows:
      python_packages:
        - cryptography
        - frida
      external:
        - Python 3.10 or newer
        - Windows installation of Aurora Slim with a local config file
        - Running compatible Aurora.exe and process attach permission for memory-hook operations
        - Aurora loopback control and active-rule APIs for memory-hook refresh and verification
        - Writable current-user HKCU Run and local installation directory for persistent-hook installation
      optional:
        - network access to PyPI for initial Frida acquisition
      verify:
        - python skills/aurora-tun-bypass/verify_dependencies.py
    macos:
      status: unsupported

  gh-issue-comment-monitor:
    path: skills/gh-issue-comment-monitor
    dependency_review:
      source_fingerprint: sha256:4070bde7ab5e639ce7a16705292ac6343e16fb7308787de12fcd03bc2dcc5cdf
      reviewed_at: "2026-10-16"
      reviewed_by: agent
      note: Scripts use Python standard library. Real issue reads require GitHub API network access plus GITHUB_TOKEN/GH_TOKEN or authenticated gh CLI fallback. The default verifier checks credential presence and gh authentication; --check-network additionally probes API reachability, not target issue permissions or token validity.
    windows:
      python_packages: []
      external:
        - GITHUB_TOKEN, GH_TOKEN, or authenticated gh CLI for real issue checks
        - network access to api.github.com for real issue checks
      verify:
        - python skills/gh-issue-comment-monitor/verify_dependencies.py
    macos:
      python_packages: []
      external:
        - GITHUB_TOKEN, GH_TOKEN, or authenticated gh CLI for real issue checks
        - network access to api.github.com for real issue checks
      verify:
        - python skills/gh-issue-comment-monitor/verify_dependencies.py

  hw-ppt-gen-html:
    path: skills/hw-ppt-gen-html
    dependency_review:
      source_fingerprint: sha256:969505688a6dcacf1c06c5f954c534375a38ad310eea873b394c76257a571775
      reviewed_at: "2026-10-16"
      reviewed_by: agent
      note: Production uses humanize-ppt for planning, html-ppt-skill for HTML runtime, Python Playwright/Chromium for export, and an independently delegated visual QA checker. The verifier only prints the Python version and checks the checker TOML file/name; it does not probe Playwright, Chromium, nested submodules, or agent availability.
    windows:
      python_packages:
        - playwright
      playwright_browsers:
        - chromium
      external:
        - Python 3
        - humanize-ppt nested submodule content for planning
        - html-ppt-skill nested submodule content
        - html_ppt_visual_qa_checker agent configuration and runtime delegation capability
      verify:
        - python skills/hw-ppt-gen-html/verify_dependencies.py
    macos:
      python_packages:
        - playwright
      playwright_browsers:
        - chromium
      external:
        - Python 3
        - humanize-ppt nested submodule content for planning
        - html-ppt-skill nested submodule content
        - html_ppt_visual_qa_checker agent configuration and runtime delegation capability
      verify:
        - python skills/hw-ppt-gen-html/verify_dependencies.py

  create-single-page-tech-report:
    path: skills/create-single-page-tech-report
    dependency_review:
      source_fingerprint: sha256:87f1e94f5db35c887b05be23f37dc0fc23be42ce80dcc9b2d193630f4599238a
      reviewed_at: "2026-10-16"
      reviewed_by: agent
      note: Reviewed after adding PPTX noGrp normalization and validation; both scripts use Python standard library only. Report creation still requires an Agent runtime with editable PowerPoint creation and rendering capabilities; ImageGen remains optional with an editable-shape fallback.
    windows:
      python_packages: []
      external:
        - Python 3.10 or newer
        - Agent runtime with editable PowerPoint creation and rendering capabilities
      optional:
        - ImageGen for custom explanatory bitmap visuals when source figures are unavailable
      verify:
        - python skills/create-single-page-tech-report/verify_dependencies.py
    macos:
      python_packages: []
      external:
        - Python 3.10 or newer
        - Agent runtime with editable PowerPoint creation and rendering capabilities
      optional:
        - ImageGen for custom explanatory bitmap visuals when source figures are unavailable
      verify:
        - python skills/create-single-page-tech-report/verify_dependencies.py

  ppt-deep-search:
    path: skills/ppt-deep-search
    dependency_review:
      source_fingerprint: sha256:ebdd3a5473ff4115f05ccec086d039258ad49aea2f8903fe2964f07d9af50024
      reviewed_at: "2026-10-27"
      reviewed_by: agent
      note: Source Understanding uses the hw-ppt-gen-html Report exporter with Python Playwright and Chromium. The verifier checks protocol files/agent names, the Report exporter file and its self-test, Markdown size, and actual Chromium launch; it does not export a real report or perform visual QA. Five forward-test contracts now target scrolling Reports. Production additionally needs subagent delegation and independent visual QA; webpage inputs need web-article-capture with Codex in-app Browser/network, while PDF inputs need grobid-docling-pdf and its runtime. --skip-services does not skip local checks or validate those downstream services.
    windows:
      python_packages:
        - playwright
      playwright_browsers:
        - chromium
      external:
        - Python 3.9 or newer
        - web-article-capture, grobid_pdf_skill, and hw-ppt-gen-html integration files
        - subagent delegation and independent visual QA capability
      optional:
        - Codex in-app Browser and target page/asset network access, required for webpage inputs
        - grobid-docling-pdf dependencies and GROBID service, required for PDF inputs
      verify:
        - python skills/ppt-deep-search/verify_dependencies.py
    macos:
      python_packages:
        - playwright
      playwright_browsers:
        - chromium
      external:
        - Python 3.9 or newer
        - web-article-capture, grobid_pdf_skill, and hw-ppt-gen-html integration files
        - subagent delegation and independent visual QA capability
      optional:
        - Codex in-app Browser and target page/asset network access, required for webpage inputs
        - grobid-docling-pdf dependencies and GROBID service, required for PDF inputs
      verify:
        - python skills/ppt-deep-search/verify_dependencies.py

  web-article-capture:
    path: skills/web-article-capture
    dependency_review:
      source_fingerprint: sha256:5837bdbfa5b4e9b5531fcc3bd315feb8ff00126db7fc986ccf4133a1d2e68ea0
      reviewed_at: "2026-10-16"
      reviewed_by: agent
      note: Validator uses Python standard library; the verifier compiles it, runs its self-test, and checks forward-test fixtures. Real webpage capture requires Codex in-app Browser plus access to target pages/assets; the verifier does not probe either or capture a real page.
    windows:
      python_packages: []
      external:
        - Codex in-app Browser for real webpage capture
        - network access to target webpages and image assets for real capture
      verify:
        - python skills/web-article-capture/verify_dependencies.py
    macos:
      python_packages: []
      external:
        - Codex in-app Browser for real webpage capture
        - network access to target webpages and image assets for real capture
      verify:
        - python skills/web-article-capture/verify_dependencies.py

  grobid-docling-pdf:
    path: skills/grobid_pdf_skill
    dependency_review:
      source_fingerprint: sha256:a52fa0239f8a62af0e203d2490c1c352a1103745505ffd2c1a2cfc12edb924ad
      reviewed_at: "2026-10-16"
      reviewed_by: agent
      note: The default local runtime uses the fixed GROBID 0.8.2 image and one managed shared container. A custom --grobid-url uses that service without local Docker management; verify_dependencies.py still inspects only the default local Docker runtime and has no service-URL override. Package imports and runtime checks do not validate full PDF extraction or GPU inference.
    windows:
      python_packages:
        - docling
        - lxml
        - torch
      external:
        - WSL2 and Docker Desktop for the default local GROBID runtime
        - Exactly one local GROBID image ID tagged only as grobid/grobid:0.8.2 for the default local runtime
        - At most one managed local container named grobid-docling-pdf on 127.0.0.1:8070 for the default local runtime
        - Reachable GROBID service at the selected URL during PDF extraction
      optional:
        - CUDA-capable PyTorch for --docling-device cuda
      verify:
        - python skills/grobid_pdf_skill/verify_dependencies.py
    macos:
      python_packages:
        - docling
        - lxml
        - torch
      external:
        - Docker Desktop for Mac for the default local GROBID runtime
        - Exactly one local GROBID image ID tagged only as grobid/grobid:0.8.2 for the default local runtime
        - At most one managed local container named grobid-docling-pdf on 127.0.0.1:8070 for the default local runtime
        - Reachable GROBID service at the selected URL during PDF extraction
      optional:
        - CUDA is not available on macOS; use --docling-device auto or cpu
      verify:
        - python skills/grobid_pdf_skill/verify_dependencies.py

  send-qq-email:
    path: skills/send-qq-email
    dependency_review:
      source_fingerprint: sha256:26f9a2fee0351f46700bea6d6533cbfcf973f324c9c7c0f8afbe7fbaac7f7d29
      reviewed_at: "2026-10-28"
      reviewed_by: agent
      note: Runtime uses Python standard library. Sender, authorization code, and recipient configuration are loaded even for dry-run; only real sends require SMTP network access. The verifier checks configuration presence, with optional --check-network for a TCP probe; it does not authenticate, negotiate STARTTLS, send mail, or verify delivery.
    windows:
      python_packages: []
      external:
        - Sender, SMTP authorization code, and recipient configuration, including for dry-run
        - network access to the selected SMTP host/port for real sends (default smtp.qq.com:587)
      verify:
        - python skills/send-qq-email/verify_dependencies.py
    macos:
      python_packages: []
      external:
        - Sender, SMTP authorization code, and recipient configuration, including for dry-run
        - network access to the selected SMTP host/port for real sends (default smtp.qq.com:587)
      verify:
        - python skills/send-qq-email/verify_dependencies.py
