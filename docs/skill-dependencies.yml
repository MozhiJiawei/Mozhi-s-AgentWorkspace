schema_version: 1
description: >
  Single source of truth for skill runtime dependencies. When a skill is added
  or dependency-relevant files change, review this file and refresh the
  dependency_review.source_fingerprint value.
skills:
  aurora-tun-bypass:
    path: skills/aurora-tun-bypass
    dependency_review:
      source_fingerprint: sha256:86c976515030f5390029c480beccee3a537c59bf4af4e8aa688e917256a05f3a
      reviewed_at: "2026-08-18"
      reviewed_by: agent
      note: Reviewed after removing the deprecated file watcher and closing the Frida hook install, update, uninstall, and exact active-rule verification paths. Runtime dependencies remain Windows, Python, cryptography, frida, Aurora's loopback APIs, and HKCU Run access; initial Frida acquisition may require PyPI network access. No Aurora credentials are required.
    windows:
      python_packages:
        - cryptography
        - frida
      external:
        - Windows installation of Aurora Slim with a local config file
      optional:
        - network access to PyPI for initial Frida acquisition
